[package]
name = "bevyearth"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
# criterion = "0.5"

[features]
dev = ["bevy/bevy_dev_tools", "bevy/render_dev_tools"]
dev_camera = ["bevy_camera_controller/free_camera"]
debug_basic_scene = []
debug_scene_camera = []

[dependencies]
anyhow = "1"
bevy = { version = "0.20.0", features = ["bevy_feathers", "bevy_ui_widgets"] }
bevy_camera_controller = { version = "0.20.0", features = ["pan_orbit_camera"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
directories = "6"
# Async HTTP + TLS
reqwest = { version = "0.12", default-features = false, features = ["http2", "charset", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Orbit propagation (2.x API)
sgp4 = "2.4.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
